[package]
name = "td-archive-server"
version = "0.1.0"
edition = "2021"

[dependencies]
array-init = "2.1"
async-stream = "0.3"
atomic-take = "1.1"
boxcar = "0.2"
bytes = "1.6"
chrono = "0.4"
env_logger = "0.10"
clap = { version = "4.5", features = ["derive"] }
comprehensive = { version = "0.5" }
comprehensive_grpc = { version = "0.5" }
comprehensive_s3 = { version = "0.1" }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
log = "0.4"
lru = "0.12"
openssl = { version = "0.10", features = ["vendored"] }  # for musl build
prometheus = "0.13"
prost = "0.13"
prost-types = "0.13"
regex = "1.10"
rust-s3 = "0.35"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
xz = "0.1"

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "mktdarchive"
path = "src/mktdarchive.rs"

[[bin]]
name = "td-archive-backup"
path = "src/td-archive-backup.rs"
